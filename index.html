    <style>
        :root {
            --bg-app: #f3f6f4;
            --bg-surface: #ffffff;
            --bg-elevated: #f8faf9;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-card: rgba(6, 95, 70, 0.14);
            --gold-text: #b45309;
        }

        html.dark {
            --bg-app: #081210;
            --bg-surface: #0f1f1c;
            --bg-elevated: #152925;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-card: rgba(212, 175, 55, 0.18);
            --gold-text: #eab308;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: var(--bg-app);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        #root {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 540px;
            height: 100dvh;
            margin: 0 auto;
            background-color: var(--bg-app);
            position: relative;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.28);
        }

        /* Header Luxury Emerald & Gold */
        .luxury-header {
            background: linear-gradient(135deg, #032b1e 0%, #065f46 58%, #043d2c 100%);
            border-bottom: 1px solid rgba(212, 175, 55, 0.35);
            padding-top: max(12px, env(safe-area-inset-top));
        }

        .luxury-card {
            background: linear-gradient(145deg, #043927 0%, #065f46 52%, #03281c 100%);
            border: 1px solid rgba(212, 175, 55, 0.42);
            box-shadow: 0 12px 28px -8px rgba(4, 57, 39, 0.55);
            position: relative;
            overflow: hidden;
        }

        .luxury-card::before {
            content: '';
            position: absolute;
            top: -45%;
            right: -25%;
            width: 220px;
            height: 220px;
            border-radius: 9999px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.18) 0%, transparent 70%);
            pointer-events: none;
        }

        .surface-card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-card);
            transition: background-color 0.25s ease, border-color 0.25s ease;
        }

        .elevated-box {
            background-color: var(--bg-elevated);
            border: 1px solid var(--border-card);
        }

        .tabular-nums {
            font-variant-numeric: tabular-nums;
        }

        /* Scroll Area */
        #main-scroll {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 24px;
        }

        #main-scroll::-webkit-scrollbar {
            width: 4px;
        }
        #main-scroll::-webkit-scrollbar-thumb {
            background: rgba(212, 175, 55, 0.3);
            border-radius: 9999px;
        }

        /* Bottom Navigation Safe Area for Android & iOS */
        #app-nav {
            flex-shrink: 0;
            background-color: var(--bg-surface);
            border-top: 1px solid var(--border-card);
            padding-top: 8px;
            padding-bottom: max(18px, env(safe-area-inset-bottom));
            z-index: 30;
            box-shadow: 0 -6px 20px rgba(0, 0, 0, 0.08);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 6px 4px;
            border-radius: 14px;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 600;
            line-height: 1.2;
            transition: all 0.2s ease;
            min-height: 50px;
        }

        .nav-item.active {
            color: #10b981;
            background: rgba(16, 185, 129, 0.12);
        }

        html:not(.dark) .nav-item.active {
            color: #065f46;
            background: rgba(6, 95, 70, 0.1);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Print Media Styles: Bersih tanpa watermark, stempel, atau tanda tangan */
        @media print {
            body * {
                visibility: hidden !important;
            }
            html, body, #root {
                height: auto !important;
                overflow: visible !important;
                background: #ffffff !important;
                color: #000000 !important;
                box-shadow: none !important;

            #printable-receipt, #printable-receipt * {
                visibility: visible !important;

                background: #ffffff !important;

            #printable-receipt {

                left: 0 !important;
                top: 0 !important;
                width: 100% !important;
                padding: 20px !important;
                border: 1px solid #cbd5e1 !important;
                box-shadow: none !important;
            }
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>

    <script>
        // =========================================================================
        // 1. FIREBASE CONFIGURATION & REAL-TIME CONNECTION
        // =========================================================================
        const firebaseConfig = {
            databaseURL: "https://aplikasi-rt-04-default-rtdb.firebaseio.com"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // =========================================================================
        // 2. APPLICATION STATE & CONSTANTS
        // =========================================================================
        const MONTHS_ID = [
            "Januari", "Februari", "Maret", "April", "Mei", "Juni",
            "Juli", "Agustus", "September", "Oktober", "November", "Desember"
        ];
        const MONTHS_SHORT = [
            "Jan", "Feb", "Mar", "Apr", "Mei", "Jun",
            "Jul", "Agu", "Sep", "Okt", "Nov", "Des"
        ];

        const DEFAULT_SETTINGS = {
            rtName: "RT 04 / RW 13",
            housingName: "Perumahan Graha Harapan Regency",
            year: "2026",
            nominalStandard: 35000,
            ketuaName: "Bpk. Miftahul Huda",
            ketuaWa: "62816583600",
            bendaharaName: "Bpk. Dimas",
            bendaharaWa: "62816583600",
            sekretarisName: "Bpk. Hendra",
            sekretarisWa: "62816583600",
            bankName: "DANA",
            bankAccount: "62816583600",
            bankHolder: "Bendahara RT 04",
            adminPin: "123456"
        };

        const state = {
            activeTab: "beranda",       // 'beranda' | 'kas' | 'iuran' | 'layanan' | 'admin'
            adminSubTab: "warga",       // 'warga' | 'kas' | 'info' | 'pengaturan'
            isAdmin: false,             // Strictly false by default for Warga
            isConnected: false,
            darkMode: localStorage.getItem("rt04_theme") !== "light",

            // Data from Firebase
            settings: { ...DEFAULT_SETTINGS },
            settingsDraft: null,        // Anti-reset draft while typing in Admin Settings
            residents: {},
            transactions: {},
            confirmations: {},
            polls: {},
            announcements: {},
            patrols: {},

            // UI Filters & Selections
            selectedMonthIdx: new Date().getMonth(), // 0..11
            iuranViewMode: "monthly",   // 'monthly' | 'annual'
            iuranSearch: "",
            iuranFilter: "all",         // 'all' | 'paid' | 'unpaid'
            kasFilter: "all",           // 'all' | 'in' | 'out'

            // Secret 5-tap counter
            headerTapCount: 0,
            headerTapTimer: null
        };

        // =========================================================================
        // 3. UTILITY FUNCTIONS
        // =========================================================================
        function formatRupiah(num, withPrefix = true) {
            const val = Math.round(Number(num) || 0);
            const formatted = val.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
            return withPrefix ? `Rp ${formatted}` : formatted;
        }

        function formatRupiahCompact(num) {
            const val = Math.round(Number(num) || 0);
            if (val === 0) return "0";
            if (val >= 1000000) return (val / 1000000).toFixed(1).replace(".0", "") + "jt";
            if (val >= 1000) return Math.round(val / 1000) + "rb";
            return val.toString();
        }

        function normalizeWaNumber(raw) {
            let digits = String(raw || "").replace(/\D/g, "");
            if (!digits) return "";
            if (digits.startsWith("0")) {
                digits = "62" + digits.slice(1);
            } else if (!digits.startsWith("62")) {
                digits = "62" + digits;
            }
            return digits;
        }

        function escapeHtml(str) {
            return String(str || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function generateId(prefix = "id") {
            return `${prefix}_${Date.now()}_${Math.random().toString(36).substring(2, 7)}`;
        }

        function showToast(message, type = "info") {
            const container = document.getElementById("toast-container");
            const toast = document.createElement("div");
            const colors = {
                success: "bg-emerald-700 text-white border-emerald-400/50",
                error: "bg-rose-700 text-white border-rose-400/50",
                warning: "bg-amber-600 text-white border-amber-300/50",
                info: "bg-slate-800 text-white border-amber-400/40"
            };
            toast.className = `px-4 py-2.5 rounded-2xl border shadow-xl text-xs font-bold text-center transition-all duration-300 transform translate-y-0 opacity-100 ${colors[type] || colors.info}`;
            toast.textContent = message;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.add("opacity-0", "-translate-y-2");
                setTimeout(() => toast.remove(), 300);
            }, 2600);
        }

        function copyTextToClipboard(text, successMsg = "Teks berhasil disalin!") {
            const textarea = document.createElement("textarea");
            textarea.value = text;
            textarea.style.position = "fixed";
            textarea.style.opacity = "0";
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try {
                const ok = document.execCommand("copy");
                if (ok) {
                    showToast(successMsg, "success");
                } else if (navigator.clipboard) {
                    navigator.clipboard.writeText(text).then(() => showToast(successMsg, "success"));
                }
            } catch (err) {
                showToast("Gagal menyalin teks otomatis", "error");
            }
            document.body.removeChild(textarea);
        }

        function openWhatsApp(phone, message) {
            const cleanPhone = normalizeWaNumber(phone);
            const encodedMsg = encodeURIComponent(message || "");
            const url = cleanPhone
                ? `https://wa.me/${cleanPhone}?text=${encodedMsg}`
                : `https://wa.me/?text=${encodedMsg}`;
            window.open(url, "_blank", "noopener,noreferrer");
        }

        // Get resident nominal payment for a given year & monthIdx (0..11)
        // Compatible with "2026-01".."2026-12", "01".."12", and legacy boolean true
        function getResidentMonthAmount(resident, year, monthIdx) {
            if (!resident || !resident.payments) return 0;
            const mm = String(monthIdx + 1).padStart(2, "0");
            const yearKey = `${year}-${mm}`;
            const p = resident.payments;
            let raw = p[yearKey];
            if (raw === undefined) raw = p[mm];
            if (raw === undefined) raw = p[String(monthIdx + 1)];

            if (raw === true) {
                return Number(state.settings.nominalStandard) || 35000;
            }
            const num = Number(raw);
            return !isNaN(num) && num > 0 ? num : 0;
        }

        function getResidentAnnualTotal(resident, year) {
            let total = 0;
            for (let m = 0; m < 12; m++) {
                total += getResidentMonthAmount(resident, year, m);
            }
            return total;
        }

        function getSortedResidents() {
            return Object.values(state.residents || {}).sort((a, b) => {
                const blokA = String(a.blok || "").toLowerCase();
                const blokB = String(b.blok || "").toLowerCase();
                if (blokA !== blokB) return blokA.localeCompare(blokB, undefined, { numeric: true });
                return String(a.name || "").localeCompare(String(b.name || ""));
            });
        }

        function getSortedTransactions() {
            return Object.values(state.transactions || {}).sort((a, b) => {
                const dateA = String(a.date || "");
                const dateB = String(b.date || "");
                if (dateA !== dateB) return dateB.localeCompare(dateA);
                return String(b.id || "").localeCompare(String(a.id || ""));
            });
        }

        function calculateFinanceSummary() {
            let totalIn = 0;
            let totalOut = 0;
            Object.values(state.transactions || {}).forEach(tx => {
                const amt = Number(tx.amount) || 0;
                if (tx.type === "in") totalIn += amt;
                else if (tx.type === "out") totalOut += amt;
            });

            const residents = getSortedResidents();
            const year = state.settings.year || "2026";
            const mIdx = state.selectedMonthIdx;
            let monthCollected = 0;
            let paidCount = 0;

            residents.forEach(r => {
                const amt = getResidentMonthAmount(r, year, mIdx);
                if (amt > 0) {
                    monthCollected += amt;
                    paidCount++;
                }
            });

            return {
                totalIn,
                totalOut,
                balance: totalIn - totalOut,
                monthCollected,
                paidCount,
                totalResidents: residents.length
            };
        }

        // Compress receipt image via HTML5 Canvas (max width 800px, JPEG quality 0.65)
        function compressReceiptImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const img = new Image();
                    img.onload = function () {
                        const maxWidth = 800;
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                        const canvas = document.createElement("canvas");
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext("2d");
                        ctx.drawImage(img, 0, 0, width, height);
                        const dataUrl = canvas.toDataURL("image/jpeg", 0.65);
                        resolve(dataUrl);
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // =========================================================================
        // 4. THEME & FIREBASE LISTENERS (LIVE AUTO-SYNC)
        // =========================================================================
        function applyTheme() {
            const html = document.documentElement;
            const sun = document.getElementById("icon-sun");
            const moon = document.getElementById("icon-moon");
            if (state.darkMode) {
                html.classList.add("dark");
                sun.classList.remove("hidden");
                moon.classList.add("hidden");
            } else {
                html.classList.remove("dark");
                sun.classList.add("hidden");
                moon.classList.remove("hidden");
            }
        }

        function updateConnectionBadge(connected) {
            state.isConnected = connected;
            const dot = document.getElementById("sync-dot");
            const ping = document.getElementById("sync-ping");
            const label = document.getElementById("sync-label");
            if (connected) {
                dot.className = "relative inline-flex rounded-full h-2 w-2 bg-emerald-400";
                ping.classList.remove("hidden");
                label.textContent = "Live Auto-Sync";
            } else {
                dot.className = "relative inline-flex rounded-full h-2 w-2 bg-amber-400";
                ping.classList.add("hidden");
                label.textContent = "Menyambung...";
            }
        }

        function attachFirebaseListeners() {
            // Connection status
            db.ref(".info/connected").on("value", snap => {
                updateConnectionBadge(snap.val() === true);
            });

            // Settings listener (protects active settingsDraft from resetting while typing)
            db.ref("settings").on("value", snap => {
                const val = snap.val() || {};
                state.settings = { ...DEFAULT_SETTINGS, ...val };
                updateHeaderText();
                // Only re-render if user is not actively typing in settings form
                if (!(state.isAdmin && state.activeTab === "admin" && state.adminSubTab === "pengaturan" && state.settingsDraft)) {
                    renderApp();
                }
            });

            // Residents listener
            db.ref("residents").on("value", snap => {
                state.residents = snap.val() || {};
                renderApp();
            });

            // Transactions listener
            db.ref("transactions").on("value", snap => {
                state.transactions = snap.val() || {};
                renderApp();
            });

            // Confirmations listener
            db.ref("confirmations").on("value", snap => {
                state.confirmations = snap.val() || {};
                renderApp();
            });

            // Polls listener
            db.ref("polls").on("value", snap => {
                state.polls = snap.val() || {};
                renderApp();
            });

            // Announcements listener
            db.ref("announcements").on("value", snap => {
                state.announcements = snap.val() || {};
                renderApp();
            });

            // Patrols listener
            db.ref("patrols").on("value", snap => {
                state.patrols = snap.val() || {};
                renderApp();
            });
        }

        function forceRefreshSync() {
            db.goOnline();
            ["settings", "residents", "transactions", "confirmations", "polls", "announcements", "patrols"].forEach(node => {
                db.ref(node).once("value").then(snap => {
                    if (node === "settings") {
                        state.settings = { ...DEFAULT_SETTINGS, ...(snap.val() || {}) };
                        updateHeaderText();
                    } else {
                        state[node] = snap.val() || {};
                    }
                    if (!(state.isAdmin && state.activeTab === "admin" && state.adminSubTab === "pengaturan" && state.settingsDraft)) {
                        renderApp();
                    }
                }).catch(() => {});
            });
        }

        // Visibility, Focus & 15-second background Auto-Sync interval
        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") forceRefreshSync();
        });
        window.addEventListener("focus", forceRefreshSync);
        setInterval(forceRefreshSync, 15000);

        function renderPollCard(poll) {
            const optionsObj = poll.options || {};
            const optionEntries = Object.entries(optionsObj);
            const totalVotes = optionEntries.reduce((sum, [, opt]) => sum + (Number(opt.votes) || 0), 0);
            const votedChoice = localStorage.getItem(`rt04_voted_${poll.id}`);

            return `
                <div class="surface-card rounded-2xl p-4 space-y-3">
                    <div class="flex items-start justify-between gap-2">
                        <h3 class="text-sm font-extrabold leading-snug">${escapeHtml(poll.question)}</h3>
                        <span class="px-2 py-0.5 rounded-lg bg-amber-500/15 text-amber-500 text-[10px] font-bold shrink-0">${totalVotes} suara</span>
                    </div>
                    <div class="space-y-2">
                        ${optionEntries.map(([optKey, opt]) => {
                            const votes = Number(opt.votes) || 0;
                            const pct = totalVotes > 0 ? Math.round((votes / totalVotes) * 100) : 0;
                            const isChosen = votedChoice === optKey;
                            return `
                                <button type="button" onclick="castPollVote('${poll.id}', '${optKey}')" class="w-full text-left relative overflow-hidden rounded-xl elevated-box p-2.5 border ${isChosen ? "border-emerald-500" : ""} transition active:scale-[0.99]">
                                    <div class="absolute inset-y-0 left-0 bg-emerald-500/15 transition-all duration-500" style="width: ${pct}%"></div>
                                    <div class="relative flex items-center justify-between gap-2 text-xs">
                                        <span class="font-bold flex items-center gap-1.5">
                                            ${isChosen ? `<span class="text-emerald-500">✔</span>` : ""}
                                            ${escapeHtml(opt.label)}
                                        </span>
                                        <span class="font-extrabold tabular-nums text-emerald-500">${pct}% (${votes})</span>
                                    </div>
                                </button>
                            `;
                        }).join("")}
                    </div>
                    <div class="text-[10px] opacity-65">Ketuk salah satu pilihan untuk memberikan suara secara langsung.</div>
                </div>
            `;
        }

        function castPollVote(pollId, optKey) {
            const storageKey = `rt04_voted_${pollId}`;
            const prevChoice = localStorage.getItem(storageKey);
            if (prevChoice === optKey) {
                showToast("Anda sudah memilih opsi ini.", "info");
                return;
            }

            if (prevChoice) {
                db.ref(`polls/${pollId}/options/${prevChoice}/votes`).transaction(curr => Math.max(0, (Number(curr) || 0) - 1));
            }
            db.ref(`polls/${pollId}/options/${optKey}/votes`).transaction(curr => (Number(curr) || 0) + 1);
            localStorage.setItem(storageKey, optKey);
            showToast("Suara Anda berhasil tercatat!", "success");
        }

            const note = document.getElementById("conf-note").value.trim();

                id,
                residentId: resId,
                residentName: resident.name,
                residentBlok: resident.blok,
                year: state.settings.year || "2026",
                monthIdx,
                amount,
                method,
                note,
                status: "pending",
                createdAt: new Date().toISOString()

        function renderIuranTab() {
            const year = state.settings.year || "2026";
            const mIdx = state.selectedMonthIdx;
            const residents = getSortedResidents();
            const summary = calculateFinanceSummary();

            const query = state.iuranSearch.toLowerCase().trim();
            const filtered = residents.filter(r => {
                const matchText = !query ||
                    String(r.name || "").toLowerCase().includes(query) ||
                    String(r.blok || "").toLowerCase().includes(query);

        function renderAnnualMatrixTable(residents, year) {

        function buildIuranWaText(format, filter) {
            const year = state.settings.year || "2026";
            const mIdx = state.selectedMonthIdx;
            const summary = calculateFinanceSummary();
            let residents = getSortedResidents();

            if (filter === "paid") {
                residents = residents.filter(r => getResidentMonthAmount(r, year, mIdx) > 0);
            } else if (filter === "unpaid") {
                residents = residents.filter(r => getResidentMonthAmount(r, year, mIdx) === 0);
            }

            if (format === "annual_summary") {
                const lines = [
                    `📊 *REKAP IURAN TAHUNAN ${state.settings.rtName.toUpperCase()}*`,
                    `_${state.settings.housingName}_`,
                    `Tahun Buku: *${year}*`,
                    `Saldo Kas Terkini: *Rp\u00A0${formatRupiah(summary.balance, false)}*`,
                    ``,
                    `*TOTAL SETORAN PER WARGA (JAN–DES):*`
                ];
                residents.forEach((r, idx) => {
                    const tot = getResidentAnnualTotal(r, year);
                    let activeMonths = 0;
                    for (let m = 0; m < 12; m++) {
                        if (getResidentMonthAmount(r, year, m) > 0) activeMonths++;
                    }
                    lines.push(`${String(idx + 1).padStart(2, "0")}. *${r.blok}* · ${r.name} (${activeMonths}/12 bln) : *Rp\u00A0${formatRupiah(tot, false)}*`);
                });
                lines.push(``);
                lines.push(`Cek detail & e-kuitansi digital di Portal RT 04.`);
                return lines.join("\n");
            }

            if (format === "compact_table") {
                const lines = [
                    `📊 *LAPORAN IURAN ${state.settings.rtName.toUpperCase()}*`,
                    `Periode: *${MONTHS_ID[mIdx]} ${year}*`,
                    `Terkumpul: *Rp\u00A0${formatRupiah(summary.monthCollected, false)}* (${summary.paidCount}/${summary.totalResidents} KK)`,
                    "```",
                    "No|Blok |Nama       |Nominal",
                    "--+-----+-----------+-------"
                ];
                residents.forEach((r, idx) => {
                    const no = String(idx + 1).padStart(2, "0");
                    const blok = String(r.blok || "").padEnd(5, " ").slice(0, 5);
                    const nama = String(r.name || "").padEnd(11, " ").slice(0, 11);
                    const amt = getResidentMonthAmount(r, year, mIdx);
                    const nom = (amt > 0 ? formatRupiahCompact(amt) : "0").padStart(7, " ");
                    lines.push(`${no}|${blok}|${nama}|${nom}`);
                });
                lines.push("```");
                lines.push(`Saldo Kas RT: *Rp\u00A0${formatRupiah(summary.balance, false)}*`);
                return lines.join("\n");
            }

            // Default: mobile_list (cleanest, full names, non-breaking Rp space, no money bag icons)
            const lines = [
                `📊 *LAPORAN IURAN WARGA ${state.settings.rtName.toUpperCase()}*`,
                `_${state.settings.housingName}_`,
                `Periode: *${MONTHS_ID[mIdx]} ${year}*`,
                `Saldo Kas RT: *Rp\u00A0${formatRupiah(summary.balance, false)}*`,
                `Total Terkumpul: *Rp\u00A0${formatRupiah(summary.monthCollected, false)}* (${summary.paidCount}/${summary.totalResidents} KK)`,
                ``,
                `*RINCIAN SETORAN WARGA:*`
            ];

            residents.forEach((r, idx) => {
                const amt = getResidentMonthAmount(r, year, mIdx);
                const nomText = amt > 0 ? `*Rp\u00A0${formatRupiah(amt, false)}*` : `Rp\u00A00`;
                lines.push(`${String(idx + 1).padStart(2, "0")}. *${r.blok}* · ${r.name} : ${nomText}`);
            });

            lines.push(``);
            lines.push(`Ringkasan: ${summary.paidCount} KK Setor • ${summary.totalResidents - summary.paidCount} KK Rp\u00A00`);
            lines.push(`Cek detail & e-kuitansi secara live di Portal Digital RT 04.`);
            return lines.join("\n");
        }

        function updateWaSharePreview() {
            const fmtEl = document.getElementById("wa-share-format");
            const fltEl = document.getElementById("wa-share-filter");
            const prevEl = document.getElementById("wa-share-preview");
            if (!fmtEl || !fltEl || !prevEl) return;
            prevEl.value = buildIuranWaText(fmtEl.value, fltEl.value);
        }

        function handleBulkImportSubmit(e) {
            e.preventDefault();
            const raw = document.getElementById("bulk-residents-text").value || "";
            const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
            if (lines.length === 0) return;

            const updates = {};
            let added = 0;
            lines.forEach((line, i) => {
                const cleaned = line.replace(/^\d+[\.\)\-]\s*/, "");
                let blok = "";
                let name = "";
                if (cleaned.includes("|")) {
                    [blok, name] = cleaned.split("|").map(s => s.trim());
                } else if (cleaned.includes(" - ")) {
                    const parts = cleaned.split(" - ");
                    blok = parts[0].trim();
                    name = parts.slice(1).join(" - ").trim();
                } else if (cleaned.includes("\t")) {
                    [blok, name] = cleaned.split("\t").map(s => s.trim());
                } else {
                    const spaceIdx = cleaned.indexOf(" ");
                    if (spaceIdx > 0) {
                        blok = cleaned.slice(0, spaceIdx).trim();
                        name = cleaned.slice(spaceIdx + 1).trim();
                    } else {
                        blok = `W-${i + 1}`;
                        name = cleaned;
                    }
                }

                if (name) {
                    const id = `${generateId("res")}_${i}`;
                    updates[`residents/${id}`] = {
                        id,
                        blok: blok.toUpperCase(),
                        name,
                        payments: {}
                    };
                    added++;
                }
            });

            if (added > 0) {
                db.ref().update(updates).then(() => {
                    closeModal();
                    showToast(`${added} data warga berhasil diimpor!`, "success");
                });
            }
        }

        function approveTransferConfirmation(confId) {
            const c = state.confirmations[confId];
            if (!c) return;
            const year = c.year || state.settings.year || "2026";
            const mm = String(Number(c.monthIdx) + 1).padStart(2, "0");
            const currentAmt = state.residents[c.residentId] ? getResidentMonthAmount(state.residents[c.residentId], year, c.monthIdx) : 0;
            const newAmt = currentAmt + (Number(c.amount) || 0);

            const updates = {};
            if (state.residents[c.residentId]) {
                updates[`residents/${c.residentId}/payments/${year}-${mm}`] = newAmt;
            }
            updates[`confirmations/${confId}/status`] = "approved";

            db.ref().update(updates).then(() => {
                showToast(`Setoran ${c.residentBlok} di-ACC (${formatRupiah(newAmt)})!`, "success");
            });
        }

        async function handleAddTransaction(e) {
            e.preventDefault();
            const btn = document.getElementById("btn-submit-tx");
            btn.disabled = true;
            btn.textContent = "Menyimpan...";

            try {
                const type = document.getElementById("tx-type").value;
                const date = document.getElementById("tx-date").value;
                const category = document.getElementById("tx-category").value.trim();
                const amount = Number(document.getElementById("tx-amount").value) || 0;
                const desc = document.getElementById("tx-desc").value.trim();
                const fileInput = document.getElementById("tx-receipt-file");

                let receiptImage = null;
                if (fileInput && fileInput.files && fileInput.files[0]) {
                    receiptImage = await compressReceiptImage(fileInput.files[0]);
                }

                const id = generateId("tx");
                const payload = { id, type, date, category, amount, desc };
                if (receiptImage) payload.receiptImage = receiptImage;

                await db.ref(`transactions/${id}`).set(payload);
                e.target.reset();
                document.getElementById("tx-date").value = new Date().toISOString().slice(0, 10);
                showToast("Transaksi kas berhasil dicatat!", "success");
            } catch (err) {
                showToast("Gagal menyimpan transaksi kas.", "error");
            } finally {
                btn.disabled = false;
                btn.textContent = "Simpan Transaksi Kas";
            }
        }

            const monthName = MONTHS_ID[state.selectedMonthIdx];

            db.ref(`transactions/${id}`).set({

                type: "in",

                amount: summary.monthCollected,
                desc: `Rekap Setoran Iuran Warga ${monthName} ${year} (${summary.paidCount} KK)`
            }).then(() => {
                showToast(`Total iuran ${monthName} (${formatRupiah(summary.monthCollected)}) tercatat ke Kas!`, "success");
            });
        }

        function updateSettingsDraft(key, value) {
            if (!state.settingsDraft) {
                state.settingsDraft = { ...state.settings };
            }
            state.settingsDraft[key] = value;
        }

        function saveAllSettings(e) {
            e.preventDefault();
            const d = state.settingsDraft || state.settings;
            const payload = {
                ...d,
                nominalStandard: Number(d.nominalStandard) || 35000,
                ketuaWa: normalizeWaNumber(d.ketuaWa),
                bendaharaWa: normalizeWaNumber(d.bendaharaWa),
                sekretarisWa: normalizeWaNumber(d.sekretarisWa)
            };

            db.ref("settings").set(payload).then(() => {
                state.settings = { ...DEFAULT_SETTINGS, ...payload };
                state.settingsDraft = null;
                updateHeaderText();
                renderApp();
                showToast("Semua pengaturan berhasil disimpan!", "success");
            }).catch(() => {
                showToast("Gagal menyimpan pengaturan.", "error");
            });
        }

        function renderApp() {
            renderBottomNav();
            const main = document.getElementById("main-scroll");
            if (!main) return;

            if (state.activeTab === "kas") {
                main.innerHTML = renderKasTab();
            } else if (state.activeTab === "iuran") {
                main.innerHTML = renderIuranTab();
            } else if (state.activeTab === "layanan") {
                main.innerHTML = renderLayananTab();
            } else if (state.activeTab === "admin" && state.isAdmin) {
                main.innerHTML = renderAdminTab();
            } else {
                main.innerHTML = renderBerandaTab();
            }
        }

        document.getElementById("btn-theme-toggle").addEventListener("click", () => {
            state.darkMode = !state.darkMode;
            localStorage.setItem("rt04_theme", state.darkMode ? "dark" : "light");
            applyTheme();
        });

        // Logout Admin Button
        document.getElementById("btn-logout-admin").addEventListener("click", logoutAdmin);

        // Secret 5-Tap Header Title Listener
        document.getElementById("header-brand-trigger").addEventListener("click", () => {
            if (state.isAdmin) {
                switchTab("admin");
                return;
            }
            state.headerTapCount++;
            clearTimeout(state.headerTapTimer);

            if (state.headerTapCount >= 5) {
                state.headerTapCount = 0;
                openAdminLoginModal();
            } else {
                if (state.headerTapCount >= 3) {
                    showToast(`Ketuk ${5 - state.headerTapCount}x lagi untuk akses pengurus`, "info");
                }
                state.headerTapTimer = setTimeout(() => {
                    state.headerTapCount = 0;
                }, 2500);
            }
        });

        // Initialize App on Window Load
        window.addEventListener("load", () => {
            applyTheme();
            renderApp();
            attachFirebaseListeners();
        });
    </script>
</body>
</html>
